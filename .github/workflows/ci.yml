name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm verify:planned
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: git diff --exit-code -- packages/dsh-whale-companion/lib
      - run: corepack pnpm pack:check
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
