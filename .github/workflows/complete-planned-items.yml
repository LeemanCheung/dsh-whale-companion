name: Complete all planned Whale Companion items

on:
  push:
    branches:
      - feat/complete-all-planned-items
    paths:
      - scripts/.complete-planned-items/**
      - .github/workflows/complete-planned-items.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-all-planned-items
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - name: Reassemble and apply deterministic completion patch
        shell: bash
        run: |
          cat scripts/.complete-planned-items/part-*.b64 > /tmp/complete-planned-items.b64
          base64 -d /tmp/complete-planned-items.b64 > /tmp/complete-planned-items.mjs.gz
          echo "7a0b0b4e8f1a898257907a70a2364d4a4f1e5042f9f2008a7aed3229d7e18cf6  /tmp/complete-planned-items.mjs.gz" | sha256sum -c -
          gzip -d -c /tmp/complete-planned-items.mjs.gz > scripts/complete-planned-items.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/complete-planned-items.mjs')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (r'"## 功能\\n\\n"', r'"## 功能\n\n"', 2),
              (r'"## Features\\n\\n"', r'"## Features\n\n"', 2),
              (r'"# Changelog\\n\\n"', r'"# Changelog\n\n"', 2),
              (r'"test-results/\\nplaywright-report/\\n"', r'"test-results/\nplaywright-report/\n"', 1),
          ]
          for old, new, expected in replacements:
              actual = source.count(old)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrences of {old!r}, found {actual}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          echo "cb024e8e89a7e6a0676485bfb3d78a25c9a7f73482a196866a1cc75b70fad8aa  scripts/complete-planned-items.mjs" | sha256sum -c -
          node --check scripts/complete-planned-items.mjs
          node scripts/complete-planned-items.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/dsh-whale-companion/src/client/store.ts')
          source = path.read_text(encoding='utf-8')
          old = "export type RawWhaleApi = TypertRemoteNamespaceMap['whaleCompanion']"
          new = old + " & { setName: (name: string) => Promise<{ ok: true, value: WhaleState } | { ok: false, error: { message: string } }> }"
          if source.count(old) != 1:
              raise SystemExit('RawWhaleApi bootstrap anchor missing or duplicated')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Install and refresh lockfile
        run: corepack pnpm install --no-frozen-lockfile
      - name: Generate Host and Remote contracts
        run: corepack pnpm build:host
      - name: Verify every planned item is present
        run: corepack pnpm verify:planned
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm pack:check
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Generate visual baselines from the real built bundle
        run: corepack pnpm test:e2e:update
      - name: Verify browser smoke and visual regression
        run: corepack pnpm test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-companion-browser-evidence
          path: |
            tests/e2e/**/*-snapshots/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf scripts/.complete-planned-items scripts/complete-planned-items.mjs .github/workflows/complete-planned-items.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "feat: complete every planned whale companion improvement"
            git push origin HEAD:feat/complete-all-planned-items
          fi
