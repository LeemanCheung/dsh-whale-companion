name: Release Whale Companion 2.3.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'LeemanCheung/dsh-whale-companion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r requirements-art.txt
      - run: corepack pnpm verify:release-workflow
      - run: corepack pnpm verify:planned
      - run: corepack pnpm verify:minke:rebuild
      - run: corepack pnpm verify:minke
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: git diff --exit-code -- packages/dsh-whale-companion/lib packages/dsh-whale-companion/src/client/minke-swim-sprite.ts
      - run: corepack pnpm pack:check
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - name: Verify 2.3.0 package identity
        run: |
          node -e "const root=require('./package.json'); const nested=require('./packages/dsh-whale-companion/package.json'); if(root.version !== '2.3.0' || nested.version !== root.version) process.exit(1)"
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v2.3.0'
          head_commit="$(git rev-parse HEAD)"
          local_tag_commit=''
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            local_tag_commit="$(git rev-list -n 1 "$tag")"
            if [ "$local_tag_commit" != "$head_commit" ]; then
              echo "Local $tag points to $local_tag_commit, not HEAD $head_commit."
              exit 1
            fi
          fi
          remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk 'NR == 1 { print $1 }')"
          if [ -z "$remote_tag_commit" ]; then
            remote_tag_commit="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          fi
          if [ -n "$remote_tag_commit" ] && [ "$remote_tag_commit" != "$head_commit" ]; then
            echo "Remote $tag points to $remote_tag_commit, not HEAD $head_commit."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists after tag verification."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$remote_tag_commit" ]; then
            if [ -z "$local_tag_commit" ]; then
              git tag -a "$tag" -m "Whale Companion 2.3.0"
            fi
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" \
            --title "Whale Companion 2.3.0 — Verified Minke Motion" \
            --generate-notes \
            --notes "Adds the reference-edited common-minke 24-frame motion card, deterministic source-to-output provenance and motion gates, stable release artifacts, and browser coverage for motion, reduced motion, and the narrow layout."
